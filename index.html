<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股持股雷達</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,"Microsoft JhengHei"}main{max-width:820px;margin:auto;padding:18px}.box,.card{background:#11243a;border:1px solid #31516d;border-radius:14px;padding:16px;margin:13px 0}input,textarea,button{box-sizing:border-box;padding:10px;border-radius:8px;border:0;margin:4px;font:inherit}button{background:#27b8e9;font-weight:bold;color:#052033}input,textarea{background:#07111f;color:white;border:1px solid #52718b;width:calc(50% - 10px)}textarea{width:calc(100% - 8px);min-height:76px}.wide{width:calc(100% - 8px)}.hint{font-size:.9em;color:#b9d7eb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}.photos{display:flex;gap:8px;overflow:auto;margin-top:10px}.photos img{height:150px;border-radius:8px;border:1px solid #52718b}h1{margin-bottom:4px}@media(max-width:520px){input{width:calc(100% - 8px)}}</style><main><h1>台股持股雷達</h1><p class="hint">資料與圖片只保存在這台手機／瀏覽器，不會公開到 GitHub，也不會自動下單。</p><div class="box"><h2>新增／更新持股資料卡</h2><div class="grid"><input id="code" placeholder="股票代號，例如 2317"><input id="name" placeholder="股票名稱"><input id="shares" type="number" placeholder="持有股數"><input id="cost" type="number" step="0.01" placeholder="成本均價（可不填）"></div><textarea id="tech" placeholder="技術分析筆記：例如 KD、MACD、均線、量價、型態"></textarea><div class="grid"><input id="support" placeholder="支撐區（可不填）"><input id="resistance" placeholder="壓力區（可不填）"><input id="action" placeholder="今日動作／續抱條件（可不填）"></div><p>日 K／技術圖（最多選 3 張；會壓縮後只存此手機）</p><input class="wide" id="pics" type="file" accept="image/*" multiple><button onclick="add()">儲存資料卡</button><p class="hint">同一股票代號再次儲存，會更新文字與股數；新選的圖片會加到原本圖片。</p></div><div class="box"><h2>我的持股與技術資料</h2><div id="list"></div></div><div class="box"><h2>提醒</h2><p>這是你記錄與整理資料的工具。K 圖若要由我判讀，仍請把圖片上傳到這個對話；我會依你的持股總表流程分析。</p></div></main><script>let s=JSON.parse(localStorage.stockRadar||"[]");const q=x=>document.querySelector(x),esc=x=>String(x||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function save(){localStorage.stockRadar=JSON.stringify(s);draw()}function draw(){list.innerHTML=s.map(x=>`<div class="card"><b>${esc(x.code)} ${esc(x.name)}</b><p>股數：${esc(x.shares)}　成本：${esc(x.cost)||"未填"}</p><p><b>技術筆記：</b>${esc(x.tech)||"未填"}</p><p>支撐：${esc(x.support)||"未填"}　壓力：${esc(x.resistance)||"未填"}</p><p><b>操作／續抱條件：</b>${esc(x.action)||"未填"}</p><div class="photos">${(x.pics||[]).map(p=>`<img src="${p}" alt="技術圖">`).join("")}</div></div>`).join("")||"<p>尚未加入資料。</p>"}function shrink(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=e=>{let im=new Image;im.onload=()=>{let n=Math.min(1100/Math.max(im.width,im.height),1),c=document.createElement("canvas");c.width=im.width*n;c.height=im.height*n;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};im.onerror=no;im.src=e.target.result};r.onerror=no;r.readAsDataURL(f)})}async function add(){let code=q("#code").value.trim(),name=q("#name").value.trim();if(!code||!name){alert("請填入股票代號與名稱");return}let files=[...q("#pics").files].slice(0,3),pics=[];try{pics=await Promise.all(files.map(shrink))}catch(e){alert("圖片讀取失敗，請換一張再試");return}let x=s.find(v=>v.code===code),d={code,name,shares:q("#shares").value,cost:q("#cost").value,tech:q("#tech").value.trim(),support:q("#support").value.trim(),resistance:q("#resistance").value.trim(),action:q("#action").value.trim(),pics};if(x)Object.assign(x,d,{pics:[...(x.pics||[]),...pics].slice(-6)});else s.push(d);save();["#code","#name","#shares","#cost","#tech","#support","#resistance","#action","#pics"].forEach(id=>q(id).value="")}draw()</script>
