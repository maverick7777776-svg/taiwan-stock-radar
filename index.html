<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股持股雷達</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,"Microsoft JhengHei"}main{max-width:800px;margin:auto;padding:24px}.box{background:#11243a;border:1px solid #31516d;border-radius:14px;padding:18px;margin:15px 0}button,input{padding:9px;border-radius:8px;border:0}button{background:#27b8e9;font-weight:bold}input{width:110px;background:#07111f;color:white;border:1px solid #52718b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #31516d;text-align:left}</style><main><h1>台股持股雷達</h1><div class="box">個人技術檢查模板。資料僅存於你的瀏覽器；不保存券商帳密、不會自動下單。</div><div class="box"><h2>新增／更新持股</h2><input id="code" placeholder="股票代號"><input id="name" placeholder="股票名稱"><input id="shares" placeholder="股數" type="number"><button onclick="add()">儲存</button></div><div class="box"><h2>持股總表</h2><table><thead><tr><th>股票</th><th>股數</th><th>技術檢查</th></tr></thead><tbody id="list"></tbody></table></div><div class="box"><h2>使用方式</h2><p>每日收盤後更新你的股數與技術條件；看支撐、壓力與失效點，再自行決定買賣。</p></div></main><script>let s=JSON.parse(localStorage.stockRadar||"[]");function draw(){list.innerHTML=s.map(x=>`<tr><td>${x.code} ${x.name}</td><td>${x.shares}</td><td>資料不足，請上傳日 K 後研判</td></tr>`).join("")||"<tr><td colspan=3>尚未加入持股</td></tr>"}function add(){let code=document.querySelector("#code").value,name=document.querySelector("#name").value,shares=+document.querySelector("#shares").value;if(code&&name){s.push({code,name,shares});localStorage.stockRadar=JSON.stringify(s);draw()}}draw()</script>
