<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股持股雷達</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,"Microsoft JhengHei"}main{max-width:800px;margin:auto;padding:24px}.box{background:#11243a;border:1px solid #31516d;border-radius:14px;padding:18px;margin:15px 0}button,input{padding:9px;border-radius:8px;border:0;margin:3px}button{background:#27b8e9;font-weight:bold;color:#052033}input{width:110px;background:#07111f;color:white;border:1px solid #52718b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #31516d;text-align:left}.hint{font-size:.9em;color:#b9d7eb}</style><main><h1>台股持股雷達</h1><div class="box">個人技術檢查模板。資料僅存於你的瀏覽器；不保存券商帳密、不會自動下單。</div><div class="box"><h2>新增／更新持股</h2><input id="code" placeholder="股票代號"><input id="name" placeholder="股票名稱"><input id="shares" placeholder="股數" type="number"><button onclick="add()">儲存</button><p class="hint">同一股票代號再次儲存，會更新股數與名稱。</p></div><div class="box"><h2>備份與轉移</h2><button onclick="backup()">匯出持股備份</button><input id="file" type="file" accept="application/json" onchange="restore(this)"><p class="hint">在舊手機按「匯出持股備份」；再到新手機選取該備份檔匯入。</p></div><div class="box"><h2>持股總表</h2><table><thead><tr><th>股票</th><th>股數</th><th>技術檢查</th></tr></thead><tbody id="list"></tbody></table></div><div class="box"><h2>使用方式</h2><p>每日收盤後更新你的股數與技術條件；看支撐、壓力與失效點，再自行決定買賣。</p></div></main><script>let s=JSON.parse(localStorage.stockRadar||"[]");function save(){localStorage.stockRadar=JSON.stringify(s);draw()}function draw(){list.innerHTML=s.map(x=>`<tr><td>${x.code} ${x.name}</td><td>${x.shares}</td><td>資料不足，請上傳日 K 後研判</td></tr>`).join("")||"<tr><td colspan=3>尚未加入持股</td></tr>"}function add(){let code=document.querySelector("#code").value.trim(),name=document.querySelector("#name").value.trim(),shares=+document.querySelector("#shares").value;if(!code||!name){alert("請填入股票代號與名稱");return}let old=s.find(x=>x.code===code);if(old){old.name=name;old.shares=shares}else{s.push({code,name,shares})}save();document.querySelector("#code").value=document.querySelector("#name").value=document.querySelector("#shares").value=""}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.download="台股持股備份.json";a.click();URL.revokeObjectURL(a.href)}function restore(input){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;s=d;save();alert("匯入完成")}catch(e){alert("這不是有效的持股備份檔")}};r.readAsText(f)}draw()</script>
