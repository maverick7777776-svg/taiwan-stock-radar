<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股持股雷達</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,'Microsoft JhengHei'}main{max-width:900px;margin:auto;padding:20px}.box{background:#11243a;border:1px solid #31516d;border-radius:14px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}b{font-size:22px}button{background:#23b7e8;border:0;border-radius:8px;padding:10px;margin:4px;font-weight:bold}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #31516d;text-align:left}input{width:75px;background:#07111f;color:white;border:1px solid #51708b;padding:6px;border-radius:6px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><main><small>PERSONAL TAIWAN STOCK DASHBOARD</small><h1>台股持股雷達</h1><div class="box">免費本機版；資料僅存這台裝置，不保存券商帳密、不會自動下單。</div><nav><button onclick="show('a')">總覽</button><button onclick="show('b')">持股帳本</button><button onclick="show('c')">技術檢查</button></nav><section id="a"><div class="grid" id="sum"></div><div class="box"><h2>今日操作總表</h2><table><thead><tr><th>股票</th><th>建議</th><th>支撐／壓力</th><th>失效點</th></tr></thead><tbody id="out"></tbody></table></div></section><section id="b" class="hide"><div class="box"><h2>持股帳本</h2><p>賣出後把股數改為 0，總覽不再追蹤。</p><table><thead><tr><th>股票</th><th>股數</th><th>成本</th><th>收盤</th></tr></thead><tbody id="book"></tbody></table></div></section><section id="c" class="hide"><div class="box"><h2>技術檢查</h2><p>每日收盤後填入 20／60 日線、量比、支撐、壓力。KD／MACD 只作輔助。</p><div id="tech"></div></div></section></main><script>let s=JSON.parse(localStorage.radar||'null')||[{c:'2317',n:'鴻海',q:33,k:264.73,p:256,a:251,r:265,m:0,n60:0,v:0},{c:'5483',n:'中美晶',q:100,k:183.79,p:183.5,a:180,r:193,m:0,n60:0,v:0},{c:'6488',n:'環球晶',q:16,k:986.25,p:981,a:940,r:1030,m:0,n60:0,v:0},{c:'6547',n:'高端疫苗',q:60,k:64.23,p:61.5,a:60,r:65,m:0,n60:0,v:0}];function I(x,k){return '<input data-c="'+x.c+'" data-k="'+k+'" value="'+x[k]+'">'}function sig(x){if(!x.m||!x.n60)return['僅觀察','補齊均線與量比'];if(x.p<x.a)return['停止攤平／風險減碼','站回支撐前不攤平'];if(x.p>x.r&&x.v>=1.3)return['可做保守價差','失守壓力時停止'];if(x.p>x.m&&x.m>x.n60)return['續抱／等待前高','跌破支撐時減碼'];return['僅觀察','跌破支撐停止攤平']}function draw(){let h=s.filter(x=>x.q),cost=h.reduce((z,x)=>z+x.q*x.k,0),val=h.reduce((z,x)=>z+x.q*x.p,0);sum.innerHTML='<div class="box">投入成本<b>NT$ '+Math.round(cost).toLocaleString()+'</b></div><div class="box">已填市值<b>NT$ '+Math.round(val).toLocaleString()+'</b></div><div class="box">追蹤持股<b>'+h.length+' 檔</b></div>';out.innerHTML=h.map(x=>{let y=sig(x);return '<tr><td>'+x.n+'<small>'+x.c+'</small></td><td>'+y[0]+'</td><td>'+x.a+' / '+x.r+'</td><td>'+y[1]+'</td></tr>'}).join('');book.innerHTML=s.map(x=>'<tr><td>'+x.n+'</td><td>'+I(x,'q')+'</td><td>'+I(x,'k')+'</td><td>'+I(x,'p')+'</td></tr>').join('');tech.innerHTML=s.map(x=>'<p><b>'+x.n+'</b> 20日線 '+I(x,'m')+' 60日線 '+I(x,'n60')+' 量比 '+I(x,'v')+' 支撐 '+I(x,'a')+' 壓力 '+I(x,'r')+'</p>').join('');document.querySelectorAll('input').forEach(e=>e.onchange=()=>{let x=s.find(x=>x.c==e.dataset.c);x[e.dataset.k]=+e.value;localStorage.radar=JSON.stringify(s);draw()})}function show(id){document.querySelectorAll('section').forEach(x=>x.className='hide');document.getElementById(id).className=''}draw()</script>
